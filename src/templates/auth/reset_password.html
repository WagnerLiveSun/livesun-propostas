{% extends 'layout.html' %}{% block content %}<main style="max-width:520px"><h1>Redefinir senha</h1>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}<form method="post" class="card p-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="nova_senha">Nova senha (mínimo 8 caracteres)</label><input class="form-control mb-3" type="password" name="nova_senha" id="nova_senha" minlength="8" autocomplete="new-password" required><label for="confirmar_senha">Confirmar senha</label><input class="form-control mb-3" type="password" name="confirmar_senha" id="confirmar_senha" minlength="8" autocomplete="new-password" required><button class="btn btn-primary">Salvar nova senha</button></form></main>{% endblock %}
