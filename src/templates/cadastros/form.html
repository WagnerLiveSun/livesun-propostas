{% extends 'layout.html' %}{% block content %}<main><h1>{{ title }}</h1><form class="card p-4" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
{% for name, limit in fields.items() %}<div class="col-md-6"><label class="form-label" for="{{ name }}">{{ name.replace('_',' ')|capitalize }}</label><input class="form-control" id="{{ name }}" name="{{ name }}" maxlength="{{ limit }}" value="{{ request.form.get(name, obj|attr(name) or '') }}" {{ 'required' if name in ['nome','telefone','descricao'] and kind != 'empresa' or name == 'nome' }}></div>{% endfor %}
{% if kind == 'itens' %}<div class="col-md-6"><label for="tipo">Tipo</label><select class="form-select" id="tipo" name="tipo"><option value="P" {{ 'selected' if obj.tipo == 'P' }}>Produto</option><option value="S" {{ 'selected' if obj.tipo == 'S' }}>Serviço</option></select></div><div class="col-md-6"><label for="valor_unitario">Valor unitário</label><input class="form-control" type="number" step="0.01" min="0" id="valor_unitario" name="valor_unitario" value="{{ request.form.get('valor_unitario', obj.valor_unitario or 0) }}" required></div>{% endif %}
{% if kind == 'empresa' %}<div class="col-12"><label for="logo">Logo da empresa (imagem)</label><input class="form-control" type="file" accept="image/png,image/jpeg,image/webp" id="logo" name="logo">{% if obj.logo %}<img class="mt-3" src="{{ url_for('gestao.logo') }}" alt="Logo da empresa" style="max-width:160px">{% endif %}</div>{% else %}<div class="col-12"><label><input type="checkbox" name="ativo" {{ 'checked' if obj.ativo }}> Ativo</label></div>{% endif %}
<div class="col-12"><button class="btn btn-primary">Salvar</button></div></div></form></main>{% endblock %}
