{% macro icon(name) -%}

{% if name == 'cloud' %}<path d="M7 18h11a4 4 0 0 0 0-8h-1A6 6 0 0 0 5.5 8 5 5 0 0 0 7 18Z"/>
{% elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>
{% elif name == 'people' %}<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-3-5"/>
{% elif name == 'chart' %}<path d="M4 3v17h17M8 15l4-5 4 2 5-7M18 5h3v3"/>
{% elif name == 'check' %}<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m7 12 3 3 7-7"/>
{% elif name == 'layers' %}<path d="m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5"/>
{% elif name == 'copy' %}<rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 4V3H3v13h1"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M19 5l-1 1M6 18l-1 1"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
{% elif name == 'support' %}<path d="M4 14v-3a8 8 0 0 1 16 0v3M20 17v1a3 3 0 0 1-3 3h-4"/><rect x="2" y="11" width="4" height="7" rx="2"/><rect x="18" y="11" width="4" height="7" rx="2"/>
{% else %}<path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-7-7Z"/><path d="M14 2v7h7M7 14h10M7 18h7"/>{% endif %}
</svg>
{%- endmacro %}
